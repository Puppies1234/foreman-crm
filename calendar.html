<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar — Foreman</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark"></span>Foreman</div>
    <nav class="nav-links">
      <a class="nav-link" href="index.html">Dashboard</a>
      <a class="nav-link active" href="calendar.html">Calendar</a>
      <a class="nav-link" href="contact.html?job=j1">Contacts</a>
    </nav>
    <div class="sidebar-footer">Foreman Home Services<br>Austin, TX</div>
  </aside>

  <main class="main">
    <div class="page-header calendar-header">
      <div>
        <h1>Calendar</h1>
        <div class="page-subtitle" id="period-label">—</div>
      </div>

      <div class="calendar-toolbar">
        <div class="view-toggle" id="view-toggle">
          <button type="button" class="view-toggle-btn" data-view="day">Day</button>
          <button type="button" class="view-toggle-btn active" data-view="week">Week</button>
          <button type="button" class="view-toggle-btn" data-view="month">Month</button>
        </div>
        <div class="nav-controls">
          <button type="button" class="nav-btn" id="nav-prev" aria-label="Previous">‹</button>
          <button type="button" class="nav-today-btn" id="nav-today">Today</button>
          <button type="button" class="nav-btn" id="nav-next" aria-label="Next">›</button>
        </div>
      </div>
    </div>

    <div class="tech-legend" id="tech-legend"></div>

    <div class="calendar-layout">
      <div id="calendar-view"></div>

      <div class="card">
        <div class="card-header"><h2>Unscheduled leads</h2></div>
        <div id="unscheduled-list"></div>
      </div>
    </div>
  </main>
</div>

<script src="js/data.js"></script>
<script src="js/calendar.js"></script>
</body>
</html>
