<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Foreman</title>
<link rel="stylesheet" href="css/styles.css?v=1790451177">
<script src="js/theme.js?v=1790451177"></script>
<script src="js/labels.js?v=1790451177"></script>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark" hidden></span><span class="brand-name">Foreman</span></div>
    <nav class="nav-links">
      <a class="nav-link" href="index.html">Dashboard</a>
      <a class="nav-link" href="calendar.html">Calendar</a>
      <a class="nav-link" href="boards.html">Boards</a>
      <a class="nav-link active" href="contacts.html">Contacts</a>
      <a class="nav-link" href="inventory.html">Inventory</a>
      <a class="nav-link" href="settings.html">Settings</a>
    </nav>
    <div class="sidebar-footer"><span class="sidebar-footer-name">Foreman Home Services</span><br>Austin, TX</div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="topbar-search">
        <svg class="topbar-search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;max-width:18px;max-height:18px;"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" id="global-search-input" placeholder="Search contacts, jobs, addresses, phone, or email…" autocomplete="off">
        <button type="button" class="topbar-search-clear" id="global-search-clear" aria-label="Clear search" tabindex="-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
        <div class="topbar-search-results" id="global-search-results" hidden></div>
      </div>
    </div>

    <!-- Contact profile: this contact's info + an index of their jobs only.
         No message/call/document/photo content from any job lives here. -->
    <div id="profile-view">
      <div class="page-header">
        <div>
          <h1 id="profile-name">—</h1>
          <div class="page-subtitle" id="profile-subtitle">—</div>
        </div>
      </div>

      <div class="detail-grid">
        <div>
          <div class="card">
            <div class="card-header"><h2>Contact</h2></div>
            <div id="profile-contact-body"></div>
          </div>
        </div>

        <div>
          <div class="card">
            <div class="card-header"><h2>Jobs</h2></div>
            <div id="profile-jobs-list"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Job detail: one job's own info, plus its own Messages, Calls &
         Transcripts, Documents and Photos — nothing from any other job. -->
    <div id="job-view" hidden>
      <div class="page-header">
        <div>
          <a class="card-eyebrow" id="job-breadcrumb" href="#">← —</a>
          <h1 id="job-title">—</h1>
          <div class="page-subtitle" id="job-subtitle">—</div>
        </div>
      </div>

      <div class="detail-grid">
        <div>
          <div class="card">
            <div class="card-header"><h2>Contact</h2></div>
            <div id="job-contact-body"></div>
          </div>
        </div>

        <div>
          <div class="card">
            <div class="card-header"><h2>Job</h2></div>
            <div class="pipeline" id="pipeline"></div>
            <div id="job-card-body"></div>

            <div class="card-eyebrow" style="margin-top:16px;">Intake Notes</div>
            <div class="notes-block" id="intake-notes"></div>

            <div class="card-eyebrow" style="margin-top:16px;">Appointment</div>
            <div class="notes-block" id="appt-summary"></div>
          </div>

          <div class="card">
            <div class="card-header"><h2>Materials Used</h2></div>
            <div id="materials-used"></div>
          </div>

          <div class="card">
            <div class="card-header"><h2>Job Activity</h2></div>
            <div class="tab-bar" id="job-tabs">
              <button type="button" class="tab-btn active" data-tab="messages">Messages</button>
              <button type="button" class="tab-btn" data-tab="calls">Calls &amp; Transcripts</button>
              <button type="button" class="tab-btn" data-tab="documents">Documents</button>
              <button type="button" class="tab-btn" data-tab="photos">Photos</button>
              <button type="button" class="tab-btn" data-tab="estimate">Estimate</button>
            </div>
            <div class="job-tab-panel" data-panel="messages" id="panel-messages"></div>
            <div class="job-tab-panel" data-panel="calls" id="panel-calls" hidden></div>
            <div class="job-tab-panel" data-panel="documents" id="panel-documents" hidden></div>
            <div class="job-tab-panel" data-panel="photos" id="panel-photos" hidden></div>
            <div class="job-tab-panel" data-panel="estimate" id="panel-estimate" hidden></div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="js/data.js?v=1790451177"></script>
<script src="js/search.js?v=1790451177"></script>
<script src="js/brand.js?v=1790451177"></script>
<script src="js/features.js?v=1790451177"></script>
<script src="js/contact.js?v=1790451177"></script>
</body>
</html>
