<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Foreman</title>
<link rel="stylesheet" href="css/styles.css">
<script src="js/theme.js"></script>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark"></span>Foreman</div>
    <nav class="nav-links">
      <a class="nav-link" href="index.html">Dashboard</a>
      <a class="nav-link" href="calendar.html">Calendar</a>
      <a class="nav-link active" href="contact.html?job=j1">Contacts</a>
      <a class="nav-link" href="settings.html">Settings</a>
    </nav>
    <div class="sidebar-footer">Foreman Home Services<br>Austin, TX</div>
  </aside>

  <main class="main">
    <div class="page-header">
      <div>
        <h1 id="page-title">—</h1>
        <div class="page-subtitle" id="page-subtitle">—</div>
      </div>
    </div>

    <div class="detail-grid">
      <div>
        <div class="card">
          <div class="card-header"><h2>Contact</h2></div>
          <div id="contact-card-body"></div>
        </div>

        <div class="card">
          <div class="card-header"><h2>Other jobs</h2></div>
          <div class="job-list-mini" id="other-jobs"></div>
        </div>
      </div>

      <div>
        <div class="card">
          <div class="card-header"><h2>Job</h2></div>
          <div class="pipeline" id="pipeline"></div>
          <div id="job-card-body"></div>

          <div class="card-eyebrow" style="margin-top:16px;">Intake notes</div>
          <div class="notes-block" id="intake-notes"></div>

          <div class="card-eyebrow" style="margin-top:16px;">Appointment</div>
          <div class="notes-block" id="appt-summary"></div>
        </div>

        <div class="card" id="call-section"></div>

        <div class="card" id="followup-section"></div>
      </div>
    </div>
  </main>
</div>

<script src="js/data.js"></script>
<script src="js/contact.js"></script>
