<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Foreman</title>
<link rel="stylesheet" href="css/styles.css?v=1790451174">
<script src="js/theme.js?v=1790451174"></script>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark" hidden></span><span class="brand-name">Foreman</span></div>
    <nav class="nav-links">
      <a class="nav-link active" href="index.html">Dashboard</a>
      <a class="nav-link" href="calendar.html">Calendar</a>
      <a class="nav-link" href="boards.html">Boards</a>
      <a class="nav-link" href="contacts.html">Contacts</a>
      <a class="nav-link" href="inventory.html">Inventory</a>
      <a class="nav-link" href="settings.html">Settings</a>
    </nav>
    <div class="sidebar-footer"><span class="sidebar-footer-name">Foreman Home Services</span><br>Austin, TX</div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="topbar-search">
        <svg class="topbar-search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;max-width:18px;max-height:18px;"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" id="global-search-input" placeholder="Search contacts, jobs, addresses, phone, or email…" autocomplete="off">
        <button type="button" class="topbar-search-clear" id="global-search-clear" aria-label="Clear search" tabindex="-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
        <div class="topbar-search-results" id="global-search-results" hidden></div>
      </div>
    </div>

    <div class="today-strip" id="today-strip">
      <div class="today-strip-text">
        <h1>Good Morning</h1>
        <div class="page-subtitle">Friday, September 18 — here's what's happening today.</div>
      </div>
      <div class="today-pill" id="today-pill"></div>
    </div>

    <div class="quick-actions" id="quick-actions"></div>

    <div class="stats-row" id="stats-row"></div>

    <div id="widget-recently-viewed">
      <div class="card-header" style="margin-bottom:12px;">
        <h2>Recently Viewed</h2>
      </div>
      <div class="recent-scroll" id="recent-scroll"></div>
    </div>

    <div class="two-col" id="dashboard-two-col">
      <div class="card" id="widget-schedule">
        <div class="card-header">
          <h2>Today's Schedule</h2>
          <a href="calendar.html" class="card-eyebrow">Full Calendar →</a>
        </div>
        <div id="schedule-list"></div>
      </div>

      <div class="card" id="widget-activity-feed">
        <div class="card-header">
          <h2>AI Activity Feed</h2>
        </div>
        <div id="activity-feed"></div>
      </div>
    </div>
  </main>
</div>

<script src="js/data.js?v=1790451174"></script>
<script src="js/search.js?v=1790451174"></script>
<script src="js/brand.js?v=1790451174"></script>
<script src="js/features.js?v=1790451174"></script>
<script src="js/dashboard.js?v=1790451174"></script>
</body>
</html>
